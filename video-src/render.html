<!doctype html>
<meta charset="utf-8">
<title>flea video renderer</title>
<style>body{margin:0;background:#000}canvas{width:100%;height:auto;display:block}</style>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="scene.js"></script>
<script>// ---------- music (original, synthesized) ----------
async function makeMusic(){
  const SR=44100,ac=new OfflineAudioContext(2,SR*TOTAL,SR);
  const master=ac.createGain();master.gain.setValueAtTime(0,0);master.gain.linearRampToValueAtTime(0.9,3);master.gain.setValueAtTime(0.9,TOTAL-7);master.gain.linearRampToValueAtTime(0,TOTAL-0.3);
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;master.connect(comp);comp.connect(ac.destination);
  const irLen=SR*3.5,ir=ac.createBuffer(2,irLen,SR);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<irLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,3);}
  const rev=ac.createConvolver();rev.buffer=ir;const revG=ac.createGain();revG.gain.value=0.35;rev.connect(revG);revG.connect(master);
  const delay=ac.createDelay(2);delay.delayTime.value=0.5625;const fb=ac.createGain();fb.gain.value=0.32;delay.connect(fb);fb.connect(delay);const dG=ac.createGain();dG.gain.value=0.35;delay.connect(dG);dG.connect(master);dG.connect(rev);
  const padF=ac.createBiquadFilter();padF.type='lowpass';padF.frequency.value=1000;padF.Q.value=0.4;const padG=ac.createGain();padG.gain.value=0.05;padF.connect(padG);padG.connect(master);padG.connect(rev);
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const CH=[{b:45,p:[57,60,64,71]},{b:41,p:[53,57,60,64]},{b:48,p:[55,60,62,67]},{b:43,p:[55,59,62,69]}];
  const BEAT=0.75,BAR=BEAT*4,nb=Math.ceil(TOTAL/BAR);
  // how busy the music is in each chapter
  const lvl=t=>t<7?0:t<40?0.6:t<68?0.3:t<105?0.85:t<128?0.9:t<165?0.4:t<185?0.85:0.45;
  const kick=t=>(t>=68&&t<128)||(t>=165&&t<185)?1:0;
  for(let b=0;b<nb;b++){
    const t0=b*BAR,ch=CH[b%4];
    for(const m of ch.p)for(const det of [-7,7]){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=hz(m);o.detune.value=det;
      const g=ac.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(0.5,t0+1.3);g.gain.setValueAtTime(0.5,t0+BAR-0.2);g.gain.linearRampToValueAtTime(0,t0+BAR+1.6);
      o.connect(g);g.connect(padF);o.start(t0);o.stop(t0+BAR+1.7);}
    {const o=ac.createOscillator();o.type='sine';o.frequency.value=hz(ch.b);const g=ac.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(0.16,t0+0.08);g.gain.exponentialRampToValueAtTime(0.05,t0+BAR);g.gain.linearRampToValueAtTime(0,t0+BAR+0.1);
      o.connect(g);g.connect(master);o.start(t0);o.stop(t0+BAR+0.15);}
    const L=lvl(t0+0.01);
    if(L>0){const pat=[0,1,2,3,2,1,2,3];for(let k=0;k<8;k++){if(L<0.5&&k%2)continue;const tt=t0+k*BEAT/2,m=ch.p[pat[k]]+12;
      const o=ac.createOscillator();o.type='triangle';o.frequency.value=hz(m);const g=ac.createGain();const amp=0.07*L*(k===0?1.2:1);
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(amp,tt+0.006);g.gain.exponentialRampToValueAtTime(0.0008,tt+0.55);
      o.connect(g);g.connect(master);g.connect(delay);o.start(tt);o.stop(tt+0.6);}}
    if(kick(t0+0.01))for(const k of [0,2]){const tt=t0+k*BEAT,o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(110,tt);o.frequency.exponentialRampToValueAtTime(42,tt+0.16);
      const g=ac.createGain();g.gain.setValueAtTime(0.32,tt);g.gain.exponentialRampToValueAtTime(0.001,tt+0.3);o.connect(g);g.connect(master);o.start(tt);o.stop(tt+0.32);}
  }
  const buf=await ac.startRendering();
  // encode 16-bit WAV
  const n=buf.length,data=new DataView(new ArrayBuffer(44+n*4)),L=buf.getChannelData(0),R=buf.getChannelData(1);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)data.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');data.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');data.setUint32(16,16,true);data.setUint16(20,1,true);data.setUint16(22,2,true);
  data.setUint32(24,SR,true);data.setUint32(28,SR*4,true);data.setUint16(32,4,true);data.setUint16(34,16,true);ws(36,'data');data.setUint32(40,n*4,true);
  let peak=0;for(let i=0;i<n;i++)peak=Math.max(peak,Math.abs(L[i]),Math.abs(R[i]));const norm=peak>0.89?0.89/peak:1;
  for(let i=0;i<n;i++){data.setInt16(44+i*4,clamp(L[i]*norm,-1,1)*32767,true);data.setInt16(46+i*4,clamp(R[i]*norm,-1,1)*32767,true);}
  return {wav:data.buffer,peak};
}

window.STATUS={phase:'idle',frame:0};
window.renderAll=async function(){
  STATUS.phase='music';const m=await makeMusic();STATUS.peak=m.peak;
  await fetch('/audio',{method:'POST',body:m.wav});
  await fetch('/start',{method:'POST'});STATUS.phase='frames';
  const N=TOTAL*FPS;
  for(let i=0;i<N;i++){drawAt(i/FPS);const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));await fetch('/frame',{method:'POST',body:blob});STATUS.frame=i+1;}
  STATUS.phase='muxing';const r=await fetch('/done',{method:'POST'});STATUS.result=await r.text();STATUS.phase='done';
};
window.drawAt=drawAt;
{const l=new URLSearchParams(location.search).get('lang');if(l)setLang(l);}
fetch('data.json').then(r=>r.json()).then(d=>{D=d;drawAt(+(new URLSearchParams(location.search).get('t')||3));window.READY=true;});

// render frames in a worker (not throttled when the page is in the background)
window.renderFast=async function(lang='zh'){
  STATUS.phase='frames';await fetch('/start',{method:'POST'});
  const w=new Worker('worker.js');
  await new Promise((res,rej)=>{w.onmessage=e=>{if(e.data.frame)STATUS.frame=e.data.frame;if(e.data.done)res();if(e.data.err)rej(e.data.err);};w.postMessage({D,lang});});
  STATUS.phase='muxing';const r=await fetch('/done',{method:'POST'});STATUS.result=await r.text();STATUS.phase='done';
};
</script>
